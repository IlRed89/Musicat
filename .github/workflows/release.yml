name: Musicat Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Portable & Inno Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run unit test validation
        run: |
          python -m unittest discover tests

      - name: Compile Standalone Portable Executable with PyInstaller
        run: |
          pyinstaller --clean build/musicat.spec

      - name: Package Portable ZIP Archive
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "${{ github.event.inputs.tag_name }}" }
          $zipName = "Musicat-$tag-Windows-Portable.zip"
          Compress-Archive -Path dist/Musicat.exe, README.md, LICENSE -DestinationPath "dist/$zipName"
          Write-Output "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Install Inno Setup
        uses: stewartcelani/innosetup-action@v1
        with:
          version: '6.2.2'

      - name: Compile Inno Setup Dual-Mode Installer
        run: |
          # Create expected folder structure for Inno Setup
          New-Item -ItemType Directory -Force -Path dist/Musicat
          Copy-Item dist/Musicat.exe dist/Musicat/Musicat.exe
          iscc installer/setup.iss

      - name: Generate SHA256 Checksums
        shell: pwsh
        run: |
          cd dist
          Get-FileHash -Algorithm SHA256 *.* | ForEach-Object { "$($_.Hash)  $($_.Path | Split-Path -Leaf)" } | Out-File -Encoding utf8 SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag_name }}
          name: "Musicat ${{ github.ref_name || github.event.inputs.tag_name }} - DJ Catalog & Smart Organizer"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
            installer/setup.iss
            dist/Installer/*.exe
