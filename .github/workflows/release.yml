name: Musicat Multi-OS Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: windows
          - os: macos-latest
            artifact_name: macos

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install libsndfile || true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run Unit Tests Validation
        run: |
          python -m unittest discover tests -v

      # --- BUILD WINDOWS ---
      - name: Build Windows Executable & Installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          pyinstaller --clean build_windows.spec
          
          # Structure dist/Musicat for portable and installer packaging
          New-Item -ItemType Directory -Force -Path dist/Musicat
          Copy-Item dist/Musicat.exe dist/Musicat/Musicat.exe
          Copy-Item README.md dist/Musicat/README.md
          if (Test-Path README_EN.md) { Copy-Item README_EN.md dist/Musicat/README_EN.md }
          Copy-Item LICENSE dist/Musicat/LICENSE
          if (Test-Path locales) { Copy-Item -Recurse locales dist/Musicat/locales }
          
          # Create portable.lock flag in portable package
          New-Item -ItemType File -Force -Path dist/Musicat/portable.lock
          
          # Package Windows Portable ZIP
          Compress-Archive -Path dist/Musicat/* -DestinationPath dist/Musicat-Windows-Portable.zip
          
          # Compile Inno Setup Dual-Mode Installer (outputs dist/Musicat-Setup-Windows-x64.exe)
          iscc installer/setup.iss
          
          # List built Windows artifacts
          Get-ChildItem dist/

      # --- BUILD MACOS ---
      - name: Build macOS Application & DMG
        if: matrix.os == 'macos-latest'
        run: |
          pyinstaller --clean build_mac.spec
          
          # Package macOS Portable ZIP (including portable.lock)
          touch dist/portable.lock
          cp README.md LICENSE dist/
          [ -f README_EN.md ] && cp README_EN.md dist/
          [ -d locales ] && cp -r locales dist/
          cd dist
          zip -r -y "Musicat-macOS-Portable.zip" "Musicat.app" "portable.lock" "README.md" "LICENSE" locales || zip -r -y "Musicat-macOS-Portable.zip" "Musicat.app" "portable.lock" "README.md" "LICENSE"
          cd ..
          
          # Package styled macOS DMG with drag & drop Applications link
          chmod +x build/build_mac_dmg.sh
          ./build/build_mac_dmg.sh || {
            echo "create-dmg failed, falling back to hdiutil..."
            hdiutil create -volname "Musicat" -srcfolder "dist/Musicat.app" -ov -format UDZO "dist/Musicat-macOS.dmg"
          }
          
          ls -lh dist/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.artifact_name }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg

  release:
    name: Publish Multi-OS GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Generate SHA256 Checksums
        run: |
          cd release_assets
          sha256sum *.* > SHA256SUMS.txt || true
          cat SHA256SUMS.txt

      - name: Publish Multi-OS GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag_name }}
          name: "Musicat ${{ github.ref_name || github.event.inputs.tag_name }} - Multi-OS (Windows & macOS)"
          draft: false
          prerelease: false
          generate_release_notes: false
          body_path: CHANGELOG.md
          files: |
            release_assets/Musicat-Setup-Windows-x64.exe
            release_assets/Musicat-Windows-Portable.zip
            release_assets/Musicat-macOS.dmg
            release_assets/Musicat-macOS-Portable.zip
            release_assets/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
